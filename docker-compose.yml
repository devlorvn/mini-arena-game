version: '3.8'

services:
  # Redis - Authoritative State Store & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: redis-game
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - game-network

